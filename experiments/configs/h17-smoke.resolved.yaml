job_name: h17-smoke
jobs_dir: /root/work/jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 2
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus2_patches.agent:Terminus2Patched
  model_name: openai/doubao-seed-2-1-lite-260915
  kwargs:
    api_base: https://ark.cn-beijing.volces.com/api/v3
    parser_name: json
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 1024000
      max_output_tokens: 0
      input_cost_per_token: 8.0e-07
      output_cost_per_token: 2.7e-06
    verifier_gate: none
    adaptive_wait: false
    task_contract: true
    deliverable_checkpoint: false
    contract_conditional: true
datasets:
- name: terminal-bench/terminal-bench-2-1
  task_names:
  - terminal-bench/cobol-modernization
  - terminal-bench/extract-elf
