# 闭环评测模板（D-085 加固版开发集，74 道）：plan 会改 job_name、n_attempts、并发、agent 开关
job_name: loop-template-v2
jobs_dir: /root/work/jobs
n_attempts: 3
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 16
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus2_patches.agent:Terminus2Patched
  model_name: openai/coder30b
  kwargs:
    api_base: http://127.0.0.1:8000/v1
    parser_name: json
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 0
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    deliverable_checkpoint: false
    interface_fixes: true
    completion_gate: true
    raw_log: true
datasets:
- path: /root/work/train/synth_split_v2/train
