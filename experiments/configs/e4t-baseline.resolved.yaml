job_name: e4t-baseline
jobs_dir: /root/work/jobs
n_attempts: 3
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 6
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus2_patches.agent:Terminus2Patched
  model_name: openai/doubao-seed-2-1-lite-260915
  kwargs:
    api_base: https://ark.cn-beijing.volces.com/api/v3
    parser_name: json
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 1024000
      max_output_tokens: 0
      input_cost_per_token: 8.0e-07
      output_cost_per_token: 2.7e-06
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    assumption_ledger: false
    budget_hint: false
    stuck_reminder: false
    exit_code_prompt: false
datasets:
- name: terminal-bench/terminal-bench-2-1
  task_names:
  - terminal-bench/adaptive-rejection-sampler
  - terminal-bench/build-pmars
  - terminal-bench/cancel-async-tasks
  - terminal-bench/chess-best-move
  - terminal-bench/count-dataset-tokens
  - terminal-bench/dna-insert
  - terminal-bench/extract-elf
  - terminal-bench/fix-code-vulnerability
  - terminal-bench/fix-git
  - terminal-bench/headless-terminal
  - terminal-bench/pytorch-model-cli
  - terminal-bench/raman-fitting
  - terminal-bench/sanitize-git-repo
  - terminal-bench/vulnerable-secret
