# E1n — 噪声底：同一配置、10 题、k=5，跑两次（job_name 后缀 s1 / s2）。
# δ = |end_to_end_pass(s1) − end_to_end_pass(s2)|，写入 HYPOTHESES.md。
# 除 n_attempts、task_names、job_name 外，与 e1_baseline_seed.yaml 完全一致。
job_name: e1n-noise-floor-s1
jobs_dir: jobs
n_attempts: 5
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - name: terminus-2
    model_name: openai/doubao-seed-2-1-lite-260915   # 候选，第 1 天确认；不要用 doubao-seed-evolving（D-023）
    kwargs:
      api_base: https://ark.cn-beijing.volces.com/api/v3
      parser_name: json
      # temperature 不设：用模型默认采样（D-026），否则 k=3 与噪声底失去意义
      max_turns: 100
      enable_summarize: true
      proactive_summarization_threshold: 8000
      model_info:
        max_input_tokens: 1024000        # 模型列表标 1024k；第 1 天核对。窗口这么大意味着压缩不会触发（D-004/D-023）
        max_output_tokens: 0
        input_cost_per_token: 0.0000008   # 0.8 元/百万 token（lite，2026-09-23 控制台）；cost 字段单位是元
        output_cost_per_token: 0.0000027  # 2.7 元/百万 token；pro 为 6 / 30
      verifier_gate: none
      adaptive_wait: false
      task_contract: false
      assumption_ledger: false
      budget_hint: false
      stuck_reminder: false
      exit_code_prompt: false

datasets:
  - name: terminal-bench/terminal-bench-2-1   # Harbor Hub 注册名，89 题（2026-09-23 核对）
    task_names: []   # 从 task_list.txt 按类别各取 1–2 题共 10 题，写成 terminal-bench/<题名>
