# TB 4.0 模板（2026-09-26）：terminal-bench/terminal-bench@4.0.0，66 题，每题 agent 时限 480 分钟；实际由 max_turns=100 封顶
job_name: tb4-TEMPLATE
jobs_dir: jobs
n_attempts: 3
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 6
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus-2
  model_name: openai/doubao-seed-2-1-lite-260915
  kwargs:
    api_base: https://ark.cn-beijing.volces.com/api/v3
    parser_name: json
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 1024000
      max_output_tokens: 0
      input_cost_per_token: 8.0e-07
      output_cost_per_token: 2.7e-06
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    deliverable_checkpoint: false
datasets:
- name: terminal-bench/terminal-bench
  version: 4.0.0
  task_names: []
