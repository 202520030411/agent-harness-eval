# 实时 Teacher 提示采样（D-069）：原版 Qwen × H2 + teacher_hint × 前两轮全挂的训练题；导出时删掉提示（启动需 TEACHER_API_KEY）
job_name: qroll-h2-synth-train-teach
jobs_dir: /root/work/jobs
n_attempts: 2
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 16
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus2_patches.agent:Terminus2Patched
  model_name: openai/coder30b
  kwargs:
    api_base: http://127.0.0.1:8000/v1
    parser_name: json
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 0
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    deliverable_checkpoint: false
    interface_fixes: true
    completion_gate: true
    raw_log: true
    store_all_messages: true
    teacher_hint: true
    teacher_knowledge: /root/work/train/teacher_knowledge.json
datasets:
- path: /root/work/train/synth_split/train_hard
