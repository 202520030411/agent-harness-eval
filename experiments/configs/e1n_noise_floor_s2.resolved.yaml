job_name: e1n-noise-floor-s2
jobs_dir: /root/work/jobs
n_attempts: 5
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus-2
  model_name: openai/doubao-seed-2-1-lite-260915
  kwargs:
    api_base: https://ark.cn-beijing.volces.com/api/v3
    parser_name: json
    temperature: 0.0
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 1024000
      max_output_tokens: 0
      input_cost_per_token: 8.0e-07
      output_cost_per_token: 2.7e-06
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    assumption_ledger: false
    budget_hint: false
    stuck_reminder: false
    exit_code_prompt: false
datasets:
- name: terminal-bench/terminal-bench-2-1
  task_names:
  - terminal-bench/fix-git
  - terminal-bench/kv-store-grpc
  - terminal-bench/cancel-async-tasks
  - terminal-bench/nginx-request-logging
  - terminal-bench/query-optimize
  - terminal-bench/vulnerable-secret
  - terminal-bench/raman-fitting
  - terminal-bench/gcode-to-text
  - terminal-bench/sqlite-db-truncate
  - terminal-bench/regex-log
