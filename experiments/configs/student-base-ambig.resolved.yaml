# 学生模型：vLLM 上的 Qwen3-Coder-30B-A3B-Instruct（served name coder30b），经服务器 → GPU 隧道 127.0.0.1:8000；训练后改 openai/ambig
job_name: student-base-ambig
jobs_dir: /root/work/jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus2_patches.agent:Terminus2Patched
  model_name: openai/coder30b
  kwargs:
    api_base: http://127.0.0.1:8000/v1
    parser_name: json
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 0
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    deliverable_checkpoint: false
datasets:
- path: /root/work/train/harbor_ambig_heldout
