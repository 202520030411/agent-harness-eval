# 强弱模型排序一致性检验（D-064）：Seed 2.1 lite × H2 × 37 道留出合成题 × 2 次。只用于评测、不进训练（不蒸馏）。
# 模型设置照 E1（temperature 0、火山方舟接口）；启动时 OPENAI_API_KEY=$ARK_API_KEY（只在宿主机进程里，不用 --ae，D-051）。
job_name: qcheck-seed-synth-heldout
jobs_dir: /root/work/jobs
n_attempts: 2
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus2_patches.agent:Terminus2Patched
  model_name: openai/doubao-seed-2-1-lite-260915
  kwargs:
    api_base: https://ark.cn-beijing.volces.com/api/v3
    parser_name: json
    temperature: 0.0
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 1024000
      max_output_tokens: 0
      input_cost_per_token: 8.0e-07
      output_cost_per_token: 2.7e-06
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    deliverable_checkpoint: false
    interface_fixes: true
    completion_gate: true
    raw_log: true
datasets:
- path: /root/work/train/synth_split/heldout
