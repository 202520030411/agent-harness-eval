# D-072 试点重跑：条件与 D-069 实时 Teacher 轮相同（只挂原版的 vLLM、并发 16、没有别的 job）；规则沿用 qpilot-psp-rules 那次写好的（train_psp）。第一次与评测同时跑（44 条并发）超时太多，已中止
job_name: qpilot-psp-rules2
jobs_dir: /root/work/jobs
n_attempts: 2
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 16
  quiet: false
environment:
  type: docker
  force_build: false
  delete: true
agents:
- name: terminus2_patches.agent:Terminus2Patched
  model_name: openai/coder30b
  kwargs:
    api_base: http://127.0.0.1:8000/v1
    parser_name: json
    max_turns: 100
    enable_summarize: true
    proactive_summarization_threshold: 8000
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 0
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    verifier_gate: none
    adaptive_wait: false
    task_contract: false
    deliverable_checkpoint: false
    interface_fixes: true
    completion_gate: true
    raw_log: true
    store_all_messages: true
datasets:
- path: /root/work/train/synth_split/train_psp
